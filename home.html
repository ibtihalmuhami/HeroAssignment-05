<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home page</title>
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- daisyui + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- stylesheet -->
    <link rel="stylesheet" href="style/style.css">

</head>

<body>
    <!-- navbar -->
    <header>
        <div class="flex justify-between items-center px-10 py-3 ">


            <div class="logo flex items-center gap-2">
                <img src="/assets/github-logo.png" alt="">
                <h2 class="font-bold text-2xl">GitHub Issues Tracker</h2>

            </div>
            <div class="nav-right flex items-center gap-1">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass translate-x-8"></i>
                    <input type="text" name="" id="" class="search-input pl-7 " placeholder="Search Issues...">

                </div>
                <button class="new-issue-btn text-white w-auto bg-blue-700">+ New Issue</button>

            </div>
        </div>
    </header>

    <!-- main part -->
    <section class="min-h-screen w-[80%] bg-base-200 mx-auto    border mt-5 border-red-500 ">
        <!--three buttons part -->

        <div
            class="w-[100%] bg-base-200  mx-auto pl-7 border rounded-b-[10px] my-2 p-6 border-b border-t border-gray-300 shadow-md">
            <button id="all-filtered-btn" class=" bg-blue-700 text-white mt-4">All </button>
            <button id="open-filtered-btn" class=" bg-white text-black mt-4">Open </button>
            <button id="closed-filtered-btn" class=" bg-white text-black mt-4">Closed </button>

        </div>

        <!-- middle part -->
        <div
            class="w-[100%] bg-base-200  mx-auto  flex items-center justify-between p-6  border rounded-b-[10px] my-2  border-b border-t border-gray-300 shadow-md">
            <div class=" flex ">
                <img src="./assets/Aperture.png" alt="">
                <h2 class="font-bold"> 50 Issues</h2>

                <p class="text-gray-400 -translate-x-17 pt-5">Track and Manage Your Project Issues</p>



            </div>
            <div class="flex items-center gap-2">
                <p class="w-3 h-3   bg-green-500 rounded-full"></p>
                <p>open</p>
                <p class="w-3 h-3   bg-purple-500 rounded-full"></p>
                <p>closed</p>
            </div>
        </div>

        <!-- card part -->
        <div id="issue-card-container" class="w-full mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="card max-w-sm bg-white border border-gray-200 rounded-xl shadow-sm p-6 font-sans">
                <div class="flex justify-between items-start mb-4">
                    <div
                        class="w-8 h-8 border-2 border-dashed border-green-500 rounded-full flex items-center justify-center">
                        <div class="w-4 h-4 rounded-full bg-green-100"></div>
                    </div>
                    <span class="bg-red-50 text-red-500 text-xs font-bold px-4 py-1.5 rounded-full tracking-wider">
                        HIGH
                    </span>
                </div>

                <div class="mb-5">
                    <h3 class="text-xl font-bold text-slate-800 leading-tight mb-2">
                        Fix Navigation Menu On Mobile Devices
                    </h3>
                    <p class="text-slate-500 text-sm leading-relaxed">
                        The navigation menu doesn't collapse properly on mobile devices...
                    </p>
                </div>

                <div class="flex gap-2 mb-6">
                    <span
                        class="inline-flex items-center gap-1 px-3 py-1 bg-red-50 text-red-500 border border-red-100 rounded-full text-xs font-semibold">
                        <span
                            class="w-3 h-3 border border-red-500 rounded-sm flex items-center justify-center text-[8px]">⚉</span>
                        BUG
                    </span>
                    <span
                        class="inline-flex items-center gap-1 px-3 py-1 bg-yellow-50 text-yellow-600 border border-yellow-100 rounded-full text-xs font-semibold">
                        <span
                            class="w-3 h-3 border border-yellow-600 rounded-full flex items-center justify-center text-[8px]">⚙</span>
                        HELP WANTED
                    </span>
                </div>

                <div class="border-t border-gray-100 pt-4">
                    <div class="text-slate-500 text-sm space-y-1">
                        <p>#1 by <span class="hover:underline cursor-pointer">john_doe</span></p>
                        <p class="text-slate-400">1/15/2024</p>
                    </div>
                </div>
            </div>






        </div>



    </section>
    <div id="single-issue-details" class="fixed inset-0  z-50 hidden bg-black/40 p-4">
        <div class="mx-auto mt-10 w-full max-w-3xl rounded-2xl bg-white p-6 shadow-2xl">
            <div class="mb-4 flex items-center justify-between">

                <button id="close-details-btn" class="bg-blue-700 text-white px-4 py-2 rounded-lg">
                    Close
                </button>
            </div>
            <div id="details-content" class="text-sm text-slate-700"></div>
        </div>
    </div>



    <!-- javascript -->

    <script src="script/home.js">




    </script>




</body>

</html>
